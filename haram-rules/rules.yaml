# HARAMd Rules Database (v2.0 - Full Quran Rules + Windows Detection)
# /etc/haram-rules/rules.yaml

rules:

  # ============================================================
  # Category: microsoft - Windows/Microsoft Detection (CRITICAL)
  # Quran Reference: Al-Baqarah 2:120, Al-Ma'idah 5:51
  # ============================================================

  - id: 66601
    name: "windows_en"
    category: "microsoft"
    severity: "critical"
    detection_type: "keyword"
    enforcement: "strict"
    enabled: true
    description: "Windows OS detection in English"
    quran_reference: "Al-Baqarah 2:120, Al-Ma'idah 5:51"
    patterns:
      - pattern: "windows"
        weight: 100
      - pattern: "microsoft"
        weight: 100
      - pattern: "windows.?10"
        weight: 100
      - pattern: "windows.?11"
        weight: 100
      - pattern: "windows.?server"
        weight: 100

  - id: 66602
    name: "windows_ru"
    category: "microsoft"
    severity: "critical"
    detection_type: "keyword"
    enforcement: "strict"
    enabled: true
    description: "Windows OS detection in Russian"
    quran_reference: "Al-Baqarah 2:120"
    patterns:
      - pattern: "виндовс"
        weight: 100
      - pattern: "винда"
        weight: 100
      - pattern: "виндовc"
        weight: 100

  - id: 66603
    name: "windows_usb_write"
    category: "microsoft"
    severity: "critical"
    detection_type: "usb_monitor"
    enforcement: "strict"
    enabled: true
    description: "Detect Windows ISO writing to USB"
    quran_reference: "Al-Baqarah 2:120"
    patterns:
      - pattern: "windows.*iso"
        weight: 100
      - pattern: "win.*usb"
        weight: 95

  - id: 66604
    name: "windows_download"
    category: "microsoft"
    severity: "critical"
    detection_type: "download_monitor"
    enforcement: "strict"
    enabled: true
    description: "Detect Windows ISO downloads"
    quran_reference: "Al-Baqarah 2:120"
    patterns:
      - pattern: "windows.*\\.iso"
        weight: 100
      - pattern: "microsoft.*download"
        weight: 90
      - pattern: "media.*creation.*tool"
        weight: 95

  - id: 66605
    name: "windows_screen"
    category: "microsoft"
    severity: "critical"
    detection_type: "screen_scan"
    enforcement: "strict"
    enabled: true
    description: "Detect Windows text on screen"
    quran_reference: "Al-Baqarah 2:120"
    patterns:
      - pattern: "windows"
        weight: 100
      - pattern: "microsoft"
        weight: 100

  - id: 66606
    name: "windows_keyboard"
    category: "microsoft"
    severity: "critical"
    detection_type: "keyboard_monitor"
    enforcement: "strict"
    enabled: true
    description: "Detect Windows keywords typed on keyboard"
    quran_reference: "Al-Baqarah 2:120"
    patterns:
      - pattern: "windows"
        weight: 100
      - pattern: "виндовс"
        weight: 100
      - pattern: "винда"
        weight: 100
      - pattern: "microsoft"
        weight: 100

