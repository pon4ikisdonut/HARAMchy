# ============================================
# HARAMchy Linux - Hyprland Configuration
# ============================================

monitor=preferred,auto,1

input {
    kb_layout = us,ru
    sensitivity = 0
    follow_mouse = 1
    numlock_by_default = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(2a9d8fEE)
    col.inactive_border = rgba(595959AA)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }
    dim {
        enabled = false
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aEE)
    }
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, snappy, slide
    animation = windowsOut, 1, 4, snappy, slide
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

# ============================================
# Key Bindings
# ============================================

$mod = SUPER

bind = $mod, Return, exec, alacritty
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, V, split:split
bind = $mod, Escape, exec, wlogout
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, E, exec, thunar
bind = $mod, D, exec, wofi --show drun

# Screenshots
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ============================================
# Autostart
# ============================================

exec-once = haramd
exec-once = waybar
exec-once = alacritty
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-picture --type image --watch cliphist store

# ============================================
# Window Rules
# ============================================

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = opacity 0.90, class:^(Alacritty)$
windowrulev2 = opacity 0.90, class:^(Code)$
