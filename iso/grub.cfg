# ============================================
# HARAMchy Linux - GRUB Configuration
# ============================================

set timeout=5
set default=0

set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm

set menu_color_normal=white/black
set menu_color_highlight=black/light-green

menuentry "HARAMchy 1.0 (Halal Linux)" {
    set root='(hd0,msdos1)'
    linux /boot/vmlinuz-6.6 root=/dev/sda1 ro loglevel=7 console=tty1 console=ttyS0,115200n8
    initrd /boot/initramfs.img
}

menuentry "HARAMchy 1.0 (Recovery Mode)" {
    set root='(hd0,msdos1)'
    linux /boot/vmlinuz-6.6 root=/dev/sda1 ro single loglevel=7 console=tty1
    initrd /boot/initramfs.img
}

menuentry "HARAMchy 1.0 (Live Session)" {
    set root='(hd0,msdos1)'
    linux /boot/vmlinuz-6.6 boot=live loglevel=7 console=tty1 console=ttyS0,115200n8
    initrd /boot/initramfs.img
}

menuentry "HARAMchy 1.0 (Debug Shell)" {
    set root='(hd0,msdos1)'
    linux /boot/vmlinuz-6.6 root=/dev/sda1 ro loglevel=7 console=tty1 init=/bin/sh
    initrd /boot/initramfs.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
